<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
           Đăng nhập | dự án phân tích năng lực học sinh
        </title>
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../css/base.css">
        <link rel="stylesheet" href="../css/components.css">
        <link rel="stylesheet" href="../css/layout.css">
    </head>
    <body>
        <main>
            <section class="login-card">
                <h1>Phân tích năng lực học sinh</h1>
                <h2>Chào mừng bạn!</h2>
                <p>Đây là dự án thi sáng tạo kỹ thuật, web giúp học sinh tiến bộ trong học tập</p>

                <div class="auth-tabs">

                    <button id="loginTab" type="button">Đăng nhập</button>
                    <button id="registerTab" type="button">Đăng ký</button>

                </div>

                <form id="loginForm">
                    <label for="username">Tên đăng nhập</label>
                    <input id="username" type="text" placeholder="Tên đăng nhập" required>

                    <label for="password">Mật khẩu</label>
                    <div class="password-field">
                    <input id="password" type="password" placeholder="Nhập mật khẩu" required>
                    <button id="toggleLoginPassword" type="button">Hiện</button>
                    </div>

                    <button type="submit">Đăng nhập</button>
                </form>
                <div id="registerModal" hidden>
                <form id="registerForm">
                    <h2>Đăng ký</h2>
                    <label for="name">Tên của bạn</label>
                    <input id="name" type="text" placeholder="Nhập họ và tên của bạn" required>

                    <label for="registrationName">Tên đăng ký</label>
                    <input id="registrationName" type="text" placeholder="Tạo tên đăng nhập" required>

                    <label for="registrationPassword">Mật khẩu đăng ký</label>
                    <input id="registrationPassword" type="password" placeholder="Tạo mật khẩu" required>

                    <label for="passwordAgain">Nhập lại mật khẩu</label>
                    <div class="passwordAgain-field">
                    <input id="passwordAgain" type="password" placeholder="Nhập lại mật khẩu để xác nhận" required>
                    <button id="togglePasswordAgain" type="button">hiện</button>
                    </div>
                    <button type="submit">Đăng ký</button>
                    <p id="registerMessage"></p>
                </form>
                <button id="closeRegister" type="button">x</button>
                </div>
            </section>
        </main>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    </body>
</html>
